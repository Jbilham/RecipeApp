substitutions:
  _REGION: us-central1
  _SERVICE_NAME: recipeapp-api
  _REPOSITORY: recipeapp
  _SERVICE_ACCOUNT: recipeapp-deployer@${PROJECT_ID}.iam.gserviceaccount.com
  _CLOUDSQL_INSTANCE: ${PROJECT_ID}:us-central1:recipeapp-db
  _DB_CONNECTION_SECRET: projects/${PROJECT_ID}/secrets/recipeapp-connection-string:latest
  _OPENAI_SECRET: projects/${PROJECT_ID}/secrets/openai-api-key:latest

options:
  substitutionOption: ALLOW_LOOSE

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}

steps:
  - name: gcr.io/cloud-builders/docker
    id: Build image
    args:
      - build
      - '-t'
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}
      - .

  - name: gcr.io/cloud-builders/docker
    id: Push image
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: Deploy to Cloud Run
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--service-account=${_SERVICE_ACCOUNT}'
      - '--port=8080'
      - '--set-env-vars=ASPNETCORE_ENVIRONMENT=Production'
      - '--set-secrets=ConnectionStrings__DefaultConnection=${_DB_CONNECTION_SECRET}'
      - '--set-secrets=OpenAI__ApiKey=${_OPENAI_SECRET}'
      - '--add-cloudsql-instances=${_CLOUDSQL_INSTANCE}'
